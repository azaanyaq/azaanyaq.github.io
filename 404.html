<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Your Name</title>
  <script>
    // GitHub Pages serves this file for any unknown path. Shareable project
    // links look like /projects/<id>, which isn't a real file, so hand them
    // to the Projects page, which opens the right project and restores the URL.
    (function () {
      var m = location.pathname.match(/^(.*\/projects)\/([^\/]+?)\/?$/);
      if (m && m[2] !== "index.html") {
        location.replace(m[1] + "/?project=" + encodeURIComponent(decodeURIComponent(m[2])));
      }
    })();
  </script>
  <meta name="theme-color" content="#0A0B0D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <!-- Root-absolute paths: this page can be served at any URL depth -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

      </ul>
    </nav>
  </header>

  <main id="main" class="container not-found">

      <h1 class="page-title">Page not found</h1>
      <p class="page-intro">That page doesn't exist. Try the <a href="/projects/">projects</a> or go back to the <a href="/">home page</a>.</p>
    </header>
  </main>
</body>
</html>
